<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Quà Trung Thu Đặc Biệt 🎁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

/* ═══════════ LANDING ═══════════ */
#landing{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,#1a0a00 0%,#000 100%);
  z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
}
#landing h1{
  font-family:'Arial Black',sans-serif;
  font-size:clamp(26px,5vw,62px);color:#ffcc00;
  text-shadow:0 0 20px #ff8800,0 0 50px #ff4400;
  text-align:center;letter-spacing:3px;
  animation:moonPulse 1.5s ease-in-out infinite alternate;
}
@keyframes moonPulse{
  from{text-shadow:0 0 20px #ff8800,0 0 50px #ff8800;transform:scale(1);}
  to{text-shadow:0 0 40px #ffcc00,0 0 120px #ffcc00;transform:scale(1.04);}
}
#moon{font-size:clamp(80px,15vw,160px);animation:moonFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 30px #ffaa00) drop-shadow(0 0 80px #ff6600);}
@keyframes moonFloat{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-18px) rotate(5deg);}}
#btn-qua{
  font-family:'Arial Black',sans-serif;font-size:clamp(20px,3.5vw,42px);
  font-weight:900;padding:22px 55px;
  background:linear-gradient(135deg,#ff6600,#ffcc00,#ff3300);
  color:#000;border:none;border-radius:60px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 0 30px #ff8800,0 0 80px #ff4400,inset 0 2px 0 rgba(255,255,255,.3);
  animation:btnShake .4s ease-in-out infinite alternate;position:relative;overflow:hidden;
}
#btn-qua::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  animation:btnShine 2s linear infinite;}
@keyframes btnShine{0%{transform:translateX(-100%) rotate(45deg);}100%{transform:translateX(100%) rotate(45deg);}}
@keyframes btnShake{from{transform:scale(1) rotate(-1deg);}to{transform:scale(1.06) rotate(1deg);}}
#landing-sub{font-family:Arial,sans-serif;font-size:clamp(14px,2vw,22px);color:#ff9944;text-align:center;opacity:.8;}
.lantern{position:fixed;font-size:clamp(24px,4vw,50px);animation:lanternSwing 2s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ff6600);}
.lantern:nth-child(1){top:5%;left:3%;animation-delay:0s;}
.lantern:nth-child(2){top:5%;right:3%;animation-delay:.5s;}
.lantern:nth-child(3){top:40%;left:1%;animation-delay:1s;}
.lantern:nth-child(4){top:40%;right:1%;animation-delay:1.5s;}
.lantern:nth-child(5){bottom:10%;left:5%;animation-delay:.3s;}
.lantern:nth-child(6){bottom:10%;right:5%;animation-delay:.8s;}
@keyframes lanternSwing{from{transform:rotate(-15deg);}to{transform:rotate(15deg);}}

/* ═══════════ TROLL ═══════════ */
#troll{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;overflow:hidden;}
body.show-troll #landing{display:none;}
body.show-troll #troll{display:block;}
body.show-troll{cursor:none;}

canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(180,0,0,.55) 100%);
  z-index:8;pointer-events:none;animation:vigP .6s ease-in-out infinite alternate;}
@keyframes vigP{from{opacity:.6;}to{opacity:1;}}
#scan{position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  z-index:9;pointer-events:none;}
#flash{position:fixed;top:0;left:0;width:100%;height:100%;
  background:#fff;opacity:0;z-index:50;pointer-events:none;animation:strobe .7s steps(1) infinite;}
@keyframes strobe{0%{opacity:0;}92%{opacity:0;}93%{opacity:.12;}94%{opacity:0;}97%{opacity:0;}98%{opacity:.08;}100%{opacity:0;}}
#fly-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;}
.fw{position:absolute;font-family:'Arial Black',sans-serif;font-weight:900;pointer-events:none;white-space:nowrap;animation:fwA linear forwards;}
@keyframes fwA{0%{opacity:0;transform:scale(.3) rotate(var(--rot));}10%{opacity:1;transform:scale(1.2) rotate(var(--rot));}85%{opacity:1;}100%{opacity:0;transform:scale(.5) rotate(calc(var(--rot)+360deg)) translateY(-60px);}}
#main{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;pointer-events:none;text-align:center;width:90vw;}
#main .line{display:block;font-family:'Arial Black',sans-serif;font-weight:900;text-transform:uppercase;white-space:nowrap;letter-spacing:3px;line-height:1.1;}
#main .line:nth-child(1){font-size:clamp(24px,5.5vw,70px);color:#ff0000;text-shadow:0 0 15px #ff0000,0 0 40px #ff0000,0 0 80px #ff0000;animation:lP .35s ease-in-out infinite alternate;}
#main .line:nth-child(2){font-size:clamp(28px,7vw,90px);color:#ffcc00;text-shadow:0 0 15px #ffcc00,0 0 40px #ff8800,0 0 80px #ff4400;animation:lP .35s ease-in-out infinite alternate;animation-delay:.1s;}
#main .line:nth-child(3){font-size:clamp(20px,4.5vw,60px);color:#ff00ff;text-shadow:0 0 15px #ff00ff,0 0 40px #aa00ff;animation:lP .35s ease-in-out infinite alternate;animation-delay:.2s;}
#main .line:nth-child(4){font-size:clamp(18px,4vw,55px);color:#00ffff;text-shadow:0 0 15px #00ffff,0 0 40px #0088ff;animation:lP .35s ease-in-out infinite alternate;animation-delay:.3s;}
#main .line:nth-child(5){font-size:clamp(22px,5vw,65px);color:#ff4400;text-shadow:0 0 15px #ff4400,0 0 40px #ff0000;animation:lP .35s ease-in-out infinite alternate;animation-delay:.4s;}
@keyframes lP{from{transform:scale(1) skewX(0deg);letter-spacing:3px;}to{transform:scale(1.07) skewX(-2deg);letter-spacing:7px;}}
.skull{position:fixed;font-size:clamp(30px,5vw,70px);z-index:20;animation:skB .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ff0000);}
.skull:nth-child(1){top:10px;left:10px;animation-delay:0s;}
.skull:nth-child(2){top:10px;right:10px;animation-delay:.12s;}
.skull:nth-child(3){bottom:10px;left:10px;animation-delay:.24s;}
.skull:nth-child(4){bottom:10px;right:10px;animation-delay:.36s;}
@keyframes skB{from{transform:scale(1) rotate(-10deg);}to{transform:scale(1.3) rotate(10deg);}}
#cur{position:fixed;width:28px;height:28px;border-radius:50%;background:#ff0000;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 18px #ff0000,0 0 45px #ff0000;animation:curP .25s ease-in-out infinite alternate;}
@keyframes curP{from{transform:translate(-50%,-50%) scale(1);}to{transform:translate(-50%,-50%) scale(1.8);}}

/* unlock overlay */
#unlock{position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  cursor:pointer;}
#unlock p{font-family:'Arial Black',sans-serif;font-size:clamp(20px,4vw,48px);
  color:#ffcc00;text-align:center;text-shadow:0 0 20px #ff8800;
  animation:moonPulse 1s ease-in-out infinite alternate;}
#unlock span{font-size:clamp(50px,10vw,100px);animation:moonFloat 1.5s ease-in-out infinite;}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="lantern">🏮</div><div class="lantern">🏮</div>
  <div class="lantern">🏮</div><div class="lantern">🏮</div>
  <div class="lantern">🏮</div><div class="lantern">🏮</div>
  <div id="moon">🌕</div>
  <h1>🎁 CÓ QUÀ TRUNG THU<br>CHO BẠN RỒI ĐÓ! 🎁</h1>
  <p id="landing-sub">Bấm vào để nhận quà đặc biệt từ chúng tôi 🥮✨</p>
  <button id="btn-qua" onclick="revealTroll()">🎁 NHẬN QUÀ NGAY 🎁</button>
</div>

<!-- TROLL -->
<div id="troll">
  <canvas id="bg"></canvas>
  <div id="vignette"></div><div id="scan"></div><div id="flash"></div>
  <div id="fly-container"></div>
  <div class="skull">💀</div><div class="skull">💀</div>
  <div class="skull">💀</div><div class="skull">💀</div>
  <div id="main">
    <span class="line">ĐỊT CON MẸ</span>
    <span class="line">BÁC PHÚ GAY</span>
    <span class="line">SIÊU CẤP BÁ KHÍ 💀🔥</span>
    <span class="line">ĐCM BÁC PHÚ VCL</span>
    <span class="line">GAY SIÊU CẤP 🍆😭🔥</span>
  </div>
  <!-- unlock audio overlay — bắt buộc Chrome cần thêm 1 gesture nữa nếu AC vẫn suspended -->
  <div id="unlock" onclick="unlockAudio(this)">
    <span>🔊</span>
    <p>BẤM VÀO ĐÂY<br>ĐỂ NGHE ÂM THANH</p>
  </div>
  <div id="cur"></div>
</div>

<script>
/* ═══════════════════════════════════
   AUDIO CONTEXT — global, tạo sẵn
═══════════════════════════════════ */
let AC = null;

function getAC(){
  if(!AC) AC = new(window.AudioContext||window.webkitAudioContext)();
  return AC;
}
function resumeAC(){
  const ac = getAC();
  if(ac.state==='suspended') return ac.resume();
  return Promise.resolve();
}

function unlockAudio(el){
  resumeAC().then(()=>{
    if(el) el.style.display='none';
    startSounds();
  });
}

/* ═══════════════════════════════════
   LANDING → TROLL
═══════════════════════════════════ */
function revealTroll(){
  // gesture ngay tại đây — quan trọng nhất
  getAC();
  resumeAC().then(()=>{
    // nếu resume ok thì giấu unlock overlay
    const u=document.getElementById('unlock');
    if(AC && AC.state==='running' && u) u.style.display='none';
  });
  document.body.classList.add('show-troll');
  initTroll();
}

/* ═══════════════════════════════════
   TROLL ENGINE
═══════════════════════════════════ */
function initTroll(){

  // cursor
  const cur=document.getElementById('cur');
  document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});

  /* canvas bg */
  const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const COLS=['#ff0000','#ff3300','#ff6600','#ff00ff','#ffff00','#00ffff','#ff0088','#ffffff','#ff4400'];
  const pts=Array.from({length:180},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*4+1,dx:(Math.random()-.5)*5,dy:(Math.random()-.5)*5,c:COLS[Math.floor(Math.random()*COLS.length)],a:Math.random()*.7+.3}));
  const bolts=[];
  setInterval(()=>{bolts.push({x1:Math.random()*canvas.width,y1:0,x2:Math.random()*canvas.width,y2:canvas.height,life:8,color:COLS[Math.floor(Math.random()*COLS.length)]});},300);
  function drawBg(){
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];ctx.save();ctx.strokeStyle=b.color;ctx.lineWidth=Math.random()*3+1;ctx.shadowColor=b.color;ctx.shadowBlur=20;ctx.globalAlpha=b.life/8;ctx.beginPath();let cx=b.x1,cy=b.y1;ctx.moveTo(cx,cy);for(let s=0;s<8;s++){cx+=(b.x2-b.x1)/8+(Math.random()-.5)*60;cy+=(b.y2-b.y1)/8;ctx.lineTo(cx,cy);}ctx.stroke();ctx.restore();b.life--;if(b.life<=0)bolts.splice(i,1);}
    pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;ctx.save();ctx.globalAlpha=p.a;ctx.shadowColor=p.c;ctx.shadowBlur=20;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});
    requestAnimationFrame(drawBg);
  }
  drawBg();

  /* flying words */
  const WORDS=['ĐỊT CON MẸ BÁC PHÚ GAY','BÁC PHÚ GAY SIÊU CẤP','ĐCM BÁC PHÚ','GAY VCL 💀','BÁC PHÚ 🍆','SIÊU CẤP BÁ KHÍ','ĐỊT MẸ MÀY','GAY BÁ KHÍ 🔥','BÁC PHÚ ĐCM','GAY SIÊU CẤP','ĐỊT CON MẸ MÀY','BÁC PHÚ LIẾM 💀','VCLLLL 🔥','ĐỊT CON MẸ 😭','BÁC PHÚ GAY 🌈💀','SIÊU GAY BÁ KHÍ','ĐCM SIÊU CẤP','BÁC PHÚ 💀💀💀','GAY 100% BÁ KHÍ','ĐỊT MẸ BÁC PHÚ 🔥','PHÚ GAY VCL','THẰNG PHÚ GAY','BÁC PHÚ CÚT 💀','VCL BÁC PHÚ DCMM','🔥 ĐCM 🔥','💀 PHÚ GAY 💀','SIÊU CẤP ĐCM','BÁ KHÍ ĐỊT MẸ','PHÚ 🍆🍆🍆','GAY KHÔNG GIẤU ĐƯỢC'];
  const fc=document.getElementById('fly-container');
  setInterval(()=>{
    const el=document.createElement('div');el.className='fw';
    el.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
    const size=Math.random()*52+12,color=COLS[Math.floor(Math.random()*COLS.length)],dur=Math.random()*2.5+1.2,left=Math.random()*92,top=Math.random()*88,rot=(Math.random()-.5)*40;
    el.style.cssText=`font-size:${size}px;color:${color};left:${left}%;top:${top}%;--rot:${rot}deg;text-shadow:0 0 8px ${color},0 0 20px ${color},0 0 40px ${color};animation-duration:${dur}s;z-index:30;`;
    fc.appendChild(el);setTimeout(()=>el.remove(),dur*1000);
  },45);

  /* sounds — chỉ start sau khi AC unlock */
  if(AC && AC.state==='running') startSounds();
}

/* ═══════════════════════════════════
   SOUND ENGINE
═══════════════════════════════════ */
let soundsStarted=false;
function startSounds(){
  if(soundsStarted) return;
  soundsStarted=true;

  function bass(){
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type='sine';
    const t=ac.currentTime;
    o.frequency.setValueAtTime(60+Math.random()*40,t);
    o.frequency.exponentialRampToValueAtTime(28,t+.8);
    g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);
    o.start(t);o.stop(t+.8);
  }

  function scream(){
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain(),d=ac.createWaveShaper();
    const curve=new Float32Array(256);
    for(let i=0;i<256;i++) curve[i]=((i/128-1)*200)/(1+Math.abs((i/128-1)*200));
    d.curve=curve;o.connect(d);d.connect(g);g.connect(ac.destination);
    o.type='sawtooth';const t=ac.currentTime;
    o.frequency.setValueAtTime(100+Math.random()*300,t);
    o.frequency.exponentialRampToValueAtTime(50+Math.random()*200,t+.7);
    g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
    o.start(t);o.stop(t+.7);
  }

  function heartbeat(){
    const ac=getAC();
    [0,.2].forEach(off=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';
      const t=ac.currentTime+off;
      o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(28,t+.14);
      g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
      o.start(t);o.stop(t+.16);
    });
  }

  /* ── RÊN RỈ synthesized ── */
  function moan(){
    const ac=getAC();
    const o=ac.createOscillator(),g=ac.createGain(),vib=ac.createOscillator(),vibG=ac.createGain();
    vib.frequency.value=5+Math.random()*4;
    vib.connect(vibG);vibG.gain.value=10+Math.random()*15;vibG.connect(o.frequency);
    o.connect(g);g.connect(ac.destination);o.type='sine';
    const t=ac.currentTime,f=180+Math.random()*120;
    o.frequency.setValueAtTime(f,t);
    o.frequency.linearRampToValueAtTime(f*1.2,t+.4);
    o.frequency.linearRampToValueAtTime(f*.9,t+.8);
    o.frequency.linearRampToValueAtTime(f*1.3,t+1.1);
    o.frequency.exponentialRampToValueAtTime(f*.6,t+1.5);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.15);
    g.gain.setValueAtTime(.45,t+1.0);g.gain.exponentialRampToValueAtTime(.001,t+1.5);
    vib.start(t);o.start(t);vib.stop(t+1.5);o.stop(t+1.5);
  }

  function moanDeep(){
    const ac=getAC();
    const o=ac.createOscillator(),g=ac.createGain(),vib=ac.createOscillator(),vibG=ac.createGain();
    vib.frequency.value=4+Math.random()*3;
    vib.connect(vibG);vibG.gain.value=6+Math.random()*10;vibG.connect(o.frequency);
    o.connect(g);g.connect(ac.destination);o.type='sine';
    const t=ac.currentTime,f=85+Math.random()*55;
    o.frequency.setValueAtTime(f,t);
    o.frequency.linearRampToValueAtTime(f*1.12,t+.55);
    o.frequency.linearRampToValueAtTime(f*.88,t+1.1);
    o.frequency.linearRampToValueAtTime(f*1.22,t+1.6);
    o.frequency.exponentialRampToValueAtTime(f*.55,t+2.0);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.2);
    g.gain.setValueAtTime(.55,t+1.5);g.gain.exponentialRampToValueAtTime(.001,t+2.0);
    vib.start(t);o.start(t);vib.stop(t+2.0);o.stop(t+2.0);
  }

  function moanBreath(){
    const ac=getAC();
    const buf=ac.createBuffer(1,ac.sampleRate*.55,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI*2)*.6;
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    f.type='bandpass';f.frequency.value=900+Math.random()*1000;f.Q.value=2.5;
    s.buffer=buf;s.connect(f);f.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(.6,ac.currentTime+.1);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.55);
    s.start();
  }

  function moanClimax(){
    const ac=getAC();
    const o=ac.createOscillator(),g=ac.createGain(),vib=ac.createOscillator(),vibG=ac.createGain();
    vib.frequency.value=8+Math.random()*6;
    vib.connect(vibG);vibG.gain.value=18+Math.random()*22;vibG.connect(o.frequency);
    o.connect(g);g.connect(ac.destination);o.type='sine';
    const t=ac.currentTime,f=200+Math.random()*100;
    o.frequency.setValueAtTime(f,t);
    o.frequency.linearRampToValueAtTime(f*1.4,t+.7);
    o.frequency.linearRampToValueAtTime(f*1.85,t+1.3);
    o.frequency.exponentialRampToValueAtTime(f*.45,t+2.1);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.2);
    g.gain.setValueAtTime(.55,t+1.5);g.gain.exponentialRampToValueAtTime(.001,t+2.1);
    vib.start(t);o.start(t);vib.stop(t+2.1);o.stop(t+2.1);
  }

  function moanDuo(){
    moan();
    setTimeout(()=>moanDeep(),160+Math.random()*220);
    setTimeout(()=>moanBreath(),400+Math.random()*300);
  }

  function bangBang(){
    const ac=getAC();
    [0,.2,.38,.54,.68,.8,.9,1.0].forEach((off,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='triangle';
      const t=ac.currentTime+off,spd=.11-i*.006;
      o.frequency.setValueAtTime(130-i*8,t);
      o.frequency.exponentialRampToValueAtTime(38,t+spd);
      g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+spd);
      o.start(t);o.stop(t+spd+.02);
    });
  }

  function metalHit(){
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type='square';
    const t=ac.currentTime;
    o.frequency.setValueAtTime(400+Math.random()*400,t);
    o.frequency.exponentialRampToValueAtTime(80,t+.25);
    g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.start(t);o.stop(t+.25);
  }

  const sfxAll=[bass,scream,heartbeat,metalHit,moan,moan,moanDeep,moanDeep,moanBreath,moanClimax,moanDuo,moanDuo,bangBang,bangBang];
  const sfxMoan=[moan,moanDeep,moanBreath,moanClimax,moanDuo,bangBang];

  // chaos interval
  setInterval(()=>{try{sfxAll[Math.floor(Math.random()*sfxAll.length)]();}catch(e){}},380);
  // moan interval riêng dày hơn
  setInterval(()=>{try{sfxMoan[Math.floor(Math.random()*sfxMoan.length)]();}catch(e){}},850);
}

// click bất kỳ đâu trên troll cũng unlock
document.addEventListener('click',()=>{
  if(AC&&AC.state==='suspended'){
    AC.resume().then(()=>{
      const u=document.getElementById('unlock');
      if(u) u.style.display='none';
      startSounds();
    });
  }
});
</script>
